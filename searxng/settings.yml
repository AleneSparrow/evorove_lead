# Minimal override merged onto SearxNG's own defaults (use_default_settings).
# The only things web_search.py actually needs: JSON output enabled, and
# the rate limiter off (it's meant to block scraping bots -- our own
# connector, querying its own local instance, is not one).
#
# Image used by docker-compose: searxng/searxng:latest
# (live instance probed 2026-10-24: 2026.9.13+96479fff6).
# Engine policy is checked against that image's default settings.yml:
#   https://github.com/searxng/searxng/blob/master/searx/settings.yml
#   https://docs.searxng.org/admin/settings/settings_engines.html
#   https://docs.searxng.org/admin/settings/settings_outgoing.html
#
# No-key general engines we turn on: bing, yahoo, qwant. Brave stays on
# as a reserve (default). Google CSE is already on and was the only
# engine that answered on the client-zero dry-run.
#
# Not enabled, on purpose:
#   startpage, mojeek — inactive upstream; Anubis/POW captcha, heavy CPU
#   marginalia, braveapi — require an API key
#   google — disabled upstream; sorry/CAPTCHA from datacenter IPs
#   wikipedia, wikidata — 429/timeout on every probe in this environment
use_default_settings: true

general:
  instance_name: "evorove_lead pilot search"

search:
  formats:
    - html
    - json
  # The client sends language=en-US on every request. That code is a SearxNG
  # search locale (language plus US region), distinct from the UI locale list,
  # which on this image only exposes "en". Bing maps it to setlang and mkt.
  # DuckDuckGo maps it to a language and a region. Google CSE maps it to hl
  # and gl. Brave maps it to a country cookie, Qwant to a locale, and Yahoo to
  # a language plus a regional domain; in the 2026-10-25 probe those three
  # returned no hits (rate limit, access denied, parsing error). A hit that
  # is still not English is dropped before a company page is fetched.
  # This file is read when the container starts. The probe used the request
  # parameter, not a restarted container.
  default_lang: "en-US"

server:
  # Local pilot only. Generate a real secret_key before exposing this
  # instance beyond localhost -- do not reuse this value in production.
  secret_key: "local_development_only_change_before_any_real_deployment"
  limiter: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  retries: 1

engines:
  - name: bing
    disabled: false
    timeout: 5.0
    retries: 1
    retry_on_http_error: [429, 500, 502, 503, 504]
  - name: yahoo
    disabled: false
    timeout: 5.0
    retries: 1
    retry_on_http_error: [429, 500, 502, 503, 504]
  - name: qwant
    disabled: false
    timeout: 5.0
    retries: 1
    retry_on_http_error: [429, 500, 502, 503, 504]
  - name: brave
    disabled: false
    timeout: 5.0
    retries: 1
    retry_on_http_error: [429]
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
