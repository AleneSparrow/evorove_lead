services:
  # The pilot's "own parser, not a paid search API" source (web_search.py):
  # a self-hosted, open-source metasearch engine. Point WEB_SEARCH_BASE_URL
  # at it (http://localhost:8080 from the host; http://searxng:8080 from
  # another container on this compose network).
  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_add:
      - SETGID
      - SETUID
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evorove_lead}
      POSTGRES_USER: ${POSTGRES_USER:-evorove_lead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      # 5433 is evorove-crm, 5434 is evorove; this warehouse gets its own port
      # and its own database -- never the CRM board, never the sales database.
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
