[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evorove-lead"
version = "0.0.0"
description = "Cycle 1 lead generation engine: a fitting person plus a grounded reason. Not live generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scrapegraphai>=2.2,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
